server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: ms-turno-usuarios
          uri: http://localhost:8081
          predicates:
            - Path=/api/turnos/**, /api/usuarios/**
        - id: ms-pacientes-practicas
          uri: http://localhost:8082
          predicates:
            - Path=/api/pacientes/**, /api/practicas/**
