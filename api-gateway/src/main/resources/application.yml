server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: ms-agenda-usuarios
          uri: http://localhost:8081
          predicates:
            - Path=/api/turnos/**, /api/usuarios/**, /api/disponibilidades/**
        - id: ms-atencion-clinica
          uri: http://localhost:8082
          predicates:
            - Path=/api/pacientes/**, /api/practicas/**, /api/evoluciones/**, /api/atencion-clinica/**
