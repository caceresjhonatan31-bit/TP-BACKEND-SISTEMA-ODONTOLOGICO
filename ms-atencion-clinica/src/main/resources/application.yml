server:
  port: 8082

spring:
  application:
    name: ms-atencion-clinica
  datasource:
    url: jdbc:postgresql://127.0.0.1:5434/db_atencion_clinica
    username: postgres
    password: password123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Monitoreo de salud y métricas operativas
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.consultorio.atencionclinica: DEBUG

clients:
  agenda-usuarios:
    url: http://localhost:8081
