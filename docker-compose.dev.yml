services:
  db-agenda-usuarios:
    image: postgres:16-alpine
    container_name: pg_agenda_usuarios
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_agenda_usuarios
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"
    volumes:
      # 1. Ejecuta el script SQL el día 1 para crear las tablas
      - ./database/init-agenda-usuarios.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # 2. Guarda los datos físicos reales dentro de tu carpeta 'data'
      - ./data/agenda-usuarios:/var/lib/postgresql/data

  db-atencion-clinica:
    image: postgres:16-alpine
    container_name: pg_atencion_clinica
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_atencion_clinica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5434:5432"
    volumes:
      # 1. Ejecuta el script SQL el día 1 para crear las tablas
      - ./database/init-atencion-clinica.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # 2. Guarda los datos físicos reales dentro de tu carpeta 'data'
      - ./data/atencion-clinica:/var/lib/postgresql/data
