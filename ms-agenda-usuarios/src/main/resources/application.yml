server:
  port: 8081

spring:
  application:
    name: ms-agenda-usuarios
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/db_agenda_usuarios
    username: postgres
    password: password123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# URLs para comunicación inter-servicio y API Externa
clients:
  atencion-clinica:
    url: ${ATENCION_CLINICA_URL:http://localhost:8082}
    enabled: ${ATENCION_CLINICA_VALIDATION_ENABLED:false}
  feriados-api:
    url: ${FERIADOS_API_URL:https://api.argentinadatos.com/v1/feriados}

# Integración Externa: Google Calendar API (RN-04 y F-04)
google:
  calendar:
    enabled: ${GOOGLE_CALENDAR_ENABLED:true}
    credentials-path: ${GOOGLE_CREDENTIALS_PATH:google-credentials.json}
    application-name: ${GOOGLE_APPLICATION_NAME:Plataforma-Turnos-Odontologicos}
    calendar-id: ${GOOGLE_CALENDAR_ID:primary}
    holidays-calendar-id: ${GOOGLE_HOLIDAYS_CALENDAR_ID:es.ar#holiday@group.v.calendar.google.com}
    zone-id: America/Argentina/Buenos_Aires
    strict-mode: ${GOOGLE_CALENDAR_STRICT_MODE:false}


